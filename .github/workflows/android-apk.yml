name: Build E.M.A TRAINING APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extract project ZIP
        run: |
          mkdir source
          unzip -q EMA_TRAINING_GitHub_Compilation.zip -d source
      - name: Build APK
        run: |
          cd source
          gradle assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EMA-TRAINING-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
